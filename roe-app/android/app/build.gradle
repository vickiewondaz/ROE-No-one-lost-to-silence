plugins {
    id 'com.android.application'
}

android {
    // MUST stay identical to the live assetlinks.json + the 30-year key in
    // ~/roe-android-key/ — changing it breaks updates and the bar-free TWA launch.
    namespace 'app.netlify.roe_pilot.twa'
    compileSdk 36

    defaultConfig {
        applicationId 'app.netlify.roe_pilot.twa'
        minSdk 24
        targetSdk 35
        // Fresh restart after full removal (v1.0.1–1.0.3 tags deleted).
        // versionCode keeps climbing so any leftover install upgrades cleanly.
        versionCode 5
        versionName '1.0.4'
    }

    signingConfigs {
        release {
            // CI provides these env vars from GitHub Secrets (PKCS#12 converted
            // from the long-lived self-signed key — same fingerprint as assetlinks).
            // Local builds without them simply produce an unsigned release APK.
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity launcher (falls back to Custom Tab where TWA is unavailable).
    // Published on the Google Maven repo (see android-browser-helper README).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    // Android 12+ splash-screen API backing Theme.SplashScreen.*.
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
